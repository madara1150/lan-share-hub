name: Build & Release

# Push a tag like v1.0.0 to build Windows + macOS and publish a GitHub Release.
# File names are fixed so README links (releases/latest/download/...) always work.
# Pushes to main only build (to catch errors); the release job runs for tags only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Version from tag
        shell: bash
        run: echo "APP_VERSION=$(v='${{ github.ref_name }}'; [[ $v == v* ]] && echo ${v#v} || echo 1.0.0)" >> $GITHUB_ENV
      - name: Build
        shell: cmd
        run: build_windows.bat
      - name: Self test of the built app (bundled Qt, QR code, serving a folder and a localhost app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LANShareHub\LANShareHub.exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest.log" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\selftest.log"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/LANShareHub-Windows-Setup.exe
            dist/LANShareHub-Windows-Portable.zip

  macos:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version from tag
        run: echo "APP_VERSION=$(v='${{ github.ref_name }}'; [[ $v == v* ]] && echo ${v#v} || echo 1.0.0)" >> $GITHUB_ENV
      - name: Build
        env:
          PYTHON: python
        run: ./build_mac.sh
      - name: Tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv-mac/bin/pip install -q pytest pytest-timeout
          .venv-mac/bin/python -m pytest -v --timeout=90 --timeout-method=thread
      - name: Self test of the built app
        run: '"dist/LAN Share Hub.app/Contents/MacOS/LAN Share Hub" --selftest "$RUNNER_TEMP/selftest.log"; s=$?; cat "$RUNNER_TEMP/selftest.log"; exit $s'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/LANShareHub-macOS.dmg

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum LANShareHub-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: LAN Share Hub ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
